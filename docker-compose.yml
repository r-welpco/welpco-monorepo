version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16.6-alpine
    container_name: welpco-postgres
    environment:
      POSTGRES_USER: welpco
      POSTGRES_PASSWORD: welpco_dev
      POSTGRES_DB: welpco_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sh:/docker-entrypoint-initdb.d/01-init-db.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U welpco -d welpco_dev"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - welpco-network

  # MailHog - Email testing tool (optional, for local email testing)
  mailhog:
    image: mailhog/mailhog:latest
    container_name: welpco-mailhog
    ports:
      - "1025:1025"  # SMTP server
      - "8025:8025"  # Web UI
    networks:
      - welpco-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8025"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local

networks:
  welpco-network:
    driver: bridge

