version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16.6-alpine
    container_name: welpco-postgres
    environment:
      POSTGRES_USER: welpco
      POSTGRES_PASSWORD: welpco_dev
      POSTGRES_DB: welpco_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sh:/docker-entrypoint-initdb.d/01-init-db.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U welpco -d welpco_dev"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - welpco-network

  # Mailpit - Email testing tool (SMTP sink + web UI). Replaces MailHog
  # (unmaintained since 2020). Same ports; nicer UI + JSON API.
  mailpit:
    image: axllent/mailpit:latest
    container_name: welpco-mailpit
    ports:
      - "1025:1025"  # SMTP server
      - "8025:8025"  # Web UI  (http://localhost:8025)
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: 1        # dev: accept any/no auth
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    networks:
      - welpco-network
    healthcheck:
      test: ["CMD", "sh", "-c", "wget --quiet --tries=1 --spider http://localhost:8025/livez || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO - S3-compatible object storage for local dev (profile + portfolio
  # photos, dispute evidence). Keeps dev off real AWS entirely.
  minio:
    image: minio/minio:latest
    container_name: welpco-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: welpco_minio
      MINIO_ROOT_PASSWORD: welpco_minio_dev
    ports:
      - "9000:9000"  # S3 API endpoint  (http://localhost:9000)
      - "9001:9001"  # Web console      (http://localhost:9001)
    volumes:
      - minio_data:/data
    networks:
      - welpco-network
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # One-shot: create the dev bucket and grant anonymous read on the public
  # prefixes (profiles/*, portfolio/*), mirroring the production bucket policy
  # so local display URLs resolve. Exits 0 when done.
  minio-init:
    image: minio/mc:latest
    container_name: welpco-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 welpco_minio welpco_minio_dev &&
      mc mb --ignore-existing local/welpco-dev &&
      mc anonymous set download local/welpco-dev/profiles &&
      mc anonymous set download local/welpco-dev/portfolio &&
      echo 'MinIO bucket welpco-dev ready (public: profiles/, portfolio/)';
      "
    networks:
      - welpco-network

volumes:
  postgres_data:
    driver: local
  minio_data:
    driver: local

networks:
  welpco-network:
    driver: bridge

