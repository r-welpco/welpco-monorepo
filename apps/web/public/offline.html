<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#2f6f4e" />
    <title>Welpco is offline</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f7faf6;
        --panel: #ffffff;
        --text: #1f2a24;
        --muted: #5f6f66;
        --accent: #2f6f4e;
        --border: #d9e2dc;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: var(--bg);
        color: var(--text);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      main {
        width: min(100%, 420px);
        padding: 28px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--panel);
        box-shadow: 0 18px 48px rgba(31, 42, 36, 0.08);
      }

      img {
        width: 48px;
        height: 48px;
        display: block;
        margin-bottom: 20px;
      }

      h1 {
        margin: 0 0 10px;
        font-size: 1.35rem;
        line-height: 1.25;
        letter-spacing: 0;
      }

      p {
        margin: 0 0 22px;
        color: var(--muted);
        line-height: 1.55;
      }

      button {
        width: 100%;
        min-height: 44px;
        border: 0;
        border-radius: 6px;
        background: var(--accent);
        color: white;
        font: inherit;
        font-weight: 650;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/android-chrome-192x192.png" alt="" />
      <h1>You are offline</h1>
      <p>
        Welpco needs a connection for bookings, payments, messages, disputes,
        and account changes. Reconnect and try again.
      </p>
      <button type="button" onclick="window.location.reload()">Try again</button>
    </main>
  </body>
</html>
