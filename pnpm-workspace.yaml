packages:
  - 'apps/*'
  - 'packages/*'

allowBuilds:
  '@nestjs/core': true
  '@parcel/watcher': true
  '@scarf/scarf': false
  '@swc/core': true
  bcrypt: true
  better-sqlite3: true
  esbuild: true
  sharp: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - '@types/node@26.2.0'
  - baseline-browser-mapping@2.11.13
  - react-hook-form@7.85.0
  - '@aws-sdk/client-s3@3.1106.0'
  - '@aws-sdk/s3-request-presigner@3.1106.0'
  - eslint@10.8.1

overrides:
  '@radix-ui/themes': '3.3.0'
